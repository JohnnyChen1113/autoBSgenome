name: Build Docker Image

on:
  push:
    paths:
      - ".github/docker/Dockerfile"
      - ".github/workflows/build-docker.yml"
      - ".github/workflows/build-bsgenome.yml"
      - "scripts/stream_fasta_to_2bit.py"
      - "tests/test_large_genome_benchmark.py"
      - "tests/test_stream_fasta_to_2bit.py"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test builder pipeline
        run: |
          python3 -m unittest discover -s tests -p 'test_stream_fasta_to_2bit.py'
          python3 -m unittest discover -s tests -p 'test_large_genome_benchmark.py'

      - name: Lowercase owner name
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/autobsgenome-builder:latest

      - name: Verify pushed image
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/autobsgenome-builder
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE}@${DIGEST}"
          docker run --rm "$IMAGE_REF" datasets version | grep -F "datasets version: 18.36.0"
          printf '%s\n' "2240faf73ca17f56f25d8009f5d50c76a7d77883a78f0287d990b417a23bf393  /usr/local/bin/datasets" \
            | docker run --rm -i "$IMAGE_REF" sha256sum --check --status
          printf '%s\n' "01f8c5a6900c88febf33e3b4cb4a8ee56bf3446e76784fce5ba00a1abd1d42a6  /usr/local/bin/faToTwoBit" \
            | docker run --rm -i "$IMAGE_REF" sha256sum --check --status
          docker run --rm "$IMAGE_REF" Rscript -e \
            "stopifnot(as.character(packageVersion('BSgenome')) == '1.74.0'); stopifnot(as.character(packageVersion('BSgenomeForge')) == '1.6.0')"
