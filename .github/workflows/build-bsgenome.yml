name: Build BSgenome Package
run-name: "[job ${{ github.event.client_payload.job_id }}] Build ${{ github.event.client_payload.package_name }} (${{ github.event.client_payload.organism }})"

on:
  repository_dispatch:
    types: [build_bsgenome]

permissions:
  contents: write
  packages: read

# Use unique concurrency group per job_id so builds don't cancel each other
concurrency:
  group: build-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Core-build SLA remains 60 minutes. The larger hard timeout allows archive
    # validation and permanent publication to finish without changing that SLA.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    container:
      # Builder release v1.1.0. The digest keeps every build on the same image.
      image: ghcr.io/johnnychen1113/autobsgenome-builder@sha256:6e347d533e7db4bd0a65c38d884184884590664ad3b5e47a14401079f3625e95

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize build metrics
        run: |
          STARTED_AT=$(date +%s)
          echo '{"schema_version":2}' > /tmp/build_metrics.json
          python3 scripts/record_metric.py timings_epoch.workflow_started "$STARTED_AT"
          python3 scripts/record_metric.py current_stage initialize
          # Capture runner hardware profile once for context (RAM, disk, CPU)
          TOTAL_MEM_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          DISK_TOTAL_KB=$(df -Pk . | awk 'NR==2 {print $2}')
          DISK_AVAIL_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          python3 scripts/record_metric.py runner.total_mem_mb $((TOTAL_MEM_KB / 1024))
          python3 scripts/record_metric.py runner.disk_total_gb $(awk "BEGIN{printf \"%.2f\", $DISK_TOTAL_KB/1024/1024}")
          python3 scripts/record_metric.py runner.disk_avail_start_gb $(awk "BEGIN{printf \"%.2f\", $DISK_AVAIL_KB/1024/1024}")
          python3 scripts/record_metric.py runner.cpu_count $(nproc)

      - name: Parse build parameters
        id: params
        env:
          # Pass the entire dispatch payload via env to avoid shell-injection from
          # quotes/backticks/dollars in organism names (e.g. "Saccharomycetaceae sp.
          # 'Ashbya aceri'"). toJSON serializes safely as a single env value.
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from build_input import complete_ensembl_identity, validate_fields
          p = json.loads(os.environ['PAYLOAD'])
          extra = p.get('extra') or {}
          if isinstance(extra, str):
              extra = json.loads(extra) if extra else {}
          fields = {
              'job_id': p.get('job_id', ''),
              'package_name': p.get('package_name', ''),
              'organism': p.get('organism', ''),
              'common_name': p.get('common_name', ''),
              'genome': p.get('genome', ''),
              'provider': p.get('provider', ''),
              'version': p.get('version', ''),
              'accession': p.get('accession', ''),
              'data_source': extra.get('data_source', 'ncbi'),
              'fasta_source': extra.get('fasta_source', extra.get('data_source', 'ncbi')),
              'fasta_url': extra.get('fasta_url', ''),
              'fasta_upload_url': extra.get('fasta_upload_url', ''),
              'fasta_file_name': extra.get('fasta_file_name', ''),
              'fasta_file_size': extra.get('fasta_file_size', ''),
              'release_date': extra.get('release_date', ''),
              'title': extra.get('title', ''),
              'description': extra.get('description', ''),
              'source_url': extra.get('source_url', ''),
              'species_url': extra.get('species_url', ''),
              'ensembl_group': extra.get('ensembl_group', ''),
              'publish_to_index': str(extra.get('publish_to_index', False)).lower(),
              'benchmark_mode': str(extra.get('benchmark_mode', False)).lower(),
              'benchmark_publication_action': extra.get(
                  'benchmark_publication_action',
                  'publish' if extra.get('publish_to_index', False) else 'skip-existing',
              ),
              'benchmark_campaign': extra.get('benchmark_campaign', ''),
              'benchmark_order': extra.get('benchmark_order', ''),
              'metadata_snapshot_date': extra.get('metadata_snapshot_date', ''),
              'build_sla_seconds': extra.get('build_sla_seconds', 3600),
              'ncbi_assembly_level': (extra.get('ncbi_assembly_stats') or {}).get('assembly_level', ''),
              'ncbi_total_sequence_length': (extra.get('ncbi_assembly_stats') or {}).get('total_sequence_length', ''),
              'ncbi_total_ungapped_length': (extra.get('ncbi_assembly_stats') or {}).get('total_ungapped_length', ''),
              'ncbi_number_of_scaffolds': (extra.get('ncbi_assembly_stats') or {}).get('number_of_scaffolds', ''),
              'ncbi_scaffold_n50': (extra.get('ncbi_assembly_stats') or {}).get('scaffold_n50', ''),
          }
          # Validate the entire payload before emitting any workflow outputs.
          fields = complete_ensembl_identity(validate_fields(fields))
          for k, v in validate_fields(fields).items():
              print(f'{k}={v}')
          PYEOF

      - name: Record benchmark definition
        if: steps.params.outputs.benchmark_mode == 'true'
        env:
          BUILD_PARAM_BENCHMARK_CAMPAIGN: ${{ steps.params.outputs.benchmark_campaign }}
          BUILD_PARAM_BENCHMARK_ORDER: ${{ steps.params.outputs.benchmark_order }}
          BUILD_PARAM_ACCESSION: ${{ steps.params.outputs.accession }}
          BUILD_PARAM_ORGANISM: ${{ steps.params.outputs.organism }}
          BUILD_PARAM_GENOME: ${{ steps.params.outputs.genome }}
          BUILD_PARAM_PROVIDER: ${{ steps.params.outputs.provider }}
          BUILD_PARAM_PACKAGE_NAME: ${{ steps.params.outputs.package_name }}
          BUILD_PARAM_METADATA_SNAPSHOT_DATE: ${{ steps.params.outputs.metadata_snapshot_date }}
          BUILD_PARAM_BUILD_SLA_SECONDS: ${{ steps.params.outputs.build_sla_seconds }}
          BUILD_PARAM_BENCHMARK_PUBLICATION_ACTION: ${{ steps.params.outputs.benchmark_publication_action }}
          BUILD_PARAM_NCBI_ASSEMBLY_LEVEL: ${{ steps.params.outputs.ncbi_assembly_level }}
          BUILD_PARAM_NCBI_TOTAL_SEQUENCE_LENGTH: ${{ steps.params.outputs.ncbi_total_sequence_length }}
          BUILD_PARAM_NCBI_TOTAL_UNGAPPED_LENGTH: ${{ steps.params.outputs.ncbi_total_ungapped_length }}
          BUILD_PARAM_NCBI_NUMBER_OF_SCAFFOLDS: ${{ steps.params.outputs.ncbi_number_of_scaffolds }}
          BUILD_PARAM_NCBI_SCAFFOLD_N50: ${{ steps.params.outputs.ncbi_scaffold_n50 }}
        run: |
          python3 scripts/record_metric.py current_stage benchmark_definition
          python3 scripts/record_metric.py benchmark.campaign "$BUILD_PARAM_BENCHMARK_CAMPAIGN"
          python3 scripts/record_metric.py benchmark.order "$BUILD_PARAM_BENCHMARK_ORDER"
          python3 scripts/record_metric.py benchmark.accession "$BUILD_PARAM_ACCESSION"
          python3 scripts/record_metric.py benchmark.organism "$BUILD_PARAM_ORGANISM"
          python3 scripts/record_metric.py benchmark.assembly "$BUILD_PARAM_GENOME"
          python3 scripts/record_metric.py benchmark.provider "$BUILD_PARAM_PROVIDER"
          python3 scripts/record_metric.py benchmark.package_name "$BUILD_PARAM_PACKAGE_NAME"
          python3 scripts/record_metric.py benchmark.metadata_snapshot_date "$BUILD_PARAM_METADATA_SNAPSHOT_DATE"
          python3 scripts/record_metric.py benchmark.build_sla_seconds "$BUILD_PARAM_BUILD_SLA_SECONDS"
          python3 scripts/record_metric.py benchmark.publication_action "$BUILD_PARAM_BENCHMARK_PUBLICATION_ACTION"
          python3 scripts/record_metric.py benchmark.ncbi_assembly_stats.assembly_level "$BUILD_PARAM_NCBI_ASSEMBLY_LEVEL"
          python3 scripts/record_metric.py benchmark.ncbi_assembly_stats.total_sequence_length "$BUILD_PARAM_NCBI_TOTAL_SEQUENCE_LENGTH"
          python3 scripts/record_metric.py benchmark.ncbi_assembly_stats.total_ungapped_length "$BUILD_PARAM_NCBI_TOTAL_UNGAPPED_LENGTH"
          python3 scripts/record_metric.py benchmark.ncbi_assembly_stats.number_of_scaffolds "$BUILD_PARAM_NCBI_NUMBER_OF_SCAFFOLDS"
          python3 scripts/record_metric.py benchmark.ncbi_assembly_stats.scaffold_n50 "$BUILD_PARAM_NCBI_SCAFFOLD_N50"

      - name: Resolve NCBI source
        id: ncbi_source
        if: steps.params.outputs.fasta_source == 'ncbi'
        env:
          ACCESSION: ${{ steps.params.outputs.accession }}
        run: |
          python3 scripts/record_metric.py current_stage ncbi_resolve
          START=$(date +%s)
          RESOLVED=false
          rm -f /tmp/ncbi_fasta_resolution.json
          if python3 scripts/resolve_ncbi_fasta.py "$ACCESSION" --json /tmp/ncbi_fasta_resolution.json; then
            FASTA_URL=$(python3 -c "import json; print(json.load(open('/tmp/ncbi_fasta_resolution.json'))['fasta_url'])")
            EXPECTED_MD5=$(python3 -c "import json; print(json.load(open('/tmp/ncbi_fasta_resolution.json'))['expected_md5'])")
            RESOLVED_TOTAL_LENGTH=$(python3 -c "import json; print(json.load(open('/tmp/ncbi_fasta_resolution.json'))['total_sequence_length'])")
            echo "fasta_url=${FASTA_URL}" >> "$GITHUB_OUTPUT"
            echo "expected_md5=${EXPECTED_MD5}" >> "$GITHUB_OUTPUT"
            echo "total_sequence_length=${RESOLVED_TOTAL_LENGTH}" >> "$GITHUB_OUTPUT"
            RESOLVED=true
          else
            echo "WARNING: NCBI FTP resolution failed; the build will use the Datasets fallback"
          fi
          END=$(date +%s)
          ELAPSED=$((END - START))
          python3 scripts/record_metric.py timings_sec.ncbi_resolve "$ELAPSED"
          echo "resolved=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "elapsed_seconds=${ELAPSED}" >> "$GITHUB_OUTPUT"

      - name: Stream NCBI FASTA to 2bit
        id: ncbi_fasta_info
        if: steps.params.outputs.fasta_source == 'ncbi'
        env:
          ACCESSION: ${{ steps.params.outputs.accession }}
          TOTAL_SEQUENCE_LENGTH: ${{ steps.params.outputs.ncbi_total_sequence_length }}
          RESOLVED: ${{ steps.ncbi_source.outputs.resolved }}
          FASTA_URL: ${{ steps.ncbi_source.outputs.fasta_url }}
          EXPECTED_MD5: ${{ steps.ncbi_source.outputs.expected_md5 }}
          RESOLVED_TOTAL_LENGTH: ${{ steps.ncbi_source.outputs.total_sequence_length }}
          RESOLVE_SECONDS: ${{ steps.ncbi_source.outputs.elapsed_seconds }}
        run: |
          set -o pipefail
          python3 scripts/record_metric.py current_stage ncbi_stream_to_2bit
          source scripts/resource_sampler.sh
          start_resource_sampler ncbi_stream_to_2bit
          trap stop_resource_sampler EXIT
          START=$(date +%s)

          THRESHOLD=$((12 * 1024 * 1024 * 1024))
          USED_LONG=false
          LONG_ARG=()
          if [[ "$TOTAL_SEQUENCE_LENGTH" =~ ^[0-9]+$ ]] && [ "$TOTAL_SEQUENCE_LENGTH" -gt "$THRESHOLD" ]; then
            echo "Large assembly (${TOTAL_SEQUENCE_LENGTH} bases); using -long 2bit format"
            LONG_ARG=(--long)
            USED_LONG=true
          fi

          STREAMED=false
          ATTEMPT_COUNT=0
          ACQUISITION_MODE=ncbi-ftp-stream
          rm -f genome.2bit /tmp/fasta_inspection.json
          if [ "$RESOLVED" = "true" ]; then
            if [[ "$RESOLVED_TOTAL_LENGTH" =~ ^[0-9]+$ ]] && [ "$RESOLVED_TOTAL_LENGTH" -gt "$THRESHOLD" ]; then
              LONG_ARG=(--long)
              USED_LONG=true
            fi
            echo "Streaming official NCBI genomic FASTA: ${FASTA_URL}"
            for attempt in 1 2 3; do
              ATTEMPT_COUNT=$attempt
              rm -f genome.2bit /tmp/fasta_inspection.json
              echo "NCBI FTP streaming attempt ${attempt}/3"
              if curl -fL --silent --show-error \
                  --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
                  "$FASTA_URL" \
                | python3 scripts/stream_fasta_to_2bit.py \
                    --source ncbi \
                    --output genome.2bit \
                    --expected-md5 "$EXPECTED_MD5" \
                    --json /tmp/fasta_inspection.json \
                    "${LONG_ARG[@]}"; then
                STREAMED=true
                break
              else
                PIPE_STATUSES=("${PIPESTATUS[@]}")
                CURL_STATUS="${PIPE_STATUSES[0]}"
                CONVERTER_STATUS="${PIPE_STATUSES[1]}"
                if [ "$CONVERTER_STATUS" = "76" ]; then
                  echo "ERROR: faToTwoBit failed; retries or a different download path cannot fix the converter process"
                  exit 1
                fi
                echo "WARNING: stream statuses: curl=${CURL_STATUS}, converter=${CONVERTER_STATUS}"
              fi
              echo "WARNING: NCBI FTP streaming attempt ${attempt} failed"
              if [ "$attempt" != "3" ]; then
                sleep $((attempt * 30))
              fi
            done
          fi

          if [ "$STREAMED" != "true" ]; then
            ACQUISITION_MODE=ncbi-datasets-fallback
            echo "Falling back to the NCBI Datasets ZIP workflow for ${ACCESSION}"
            rm -f genome.2bit genome.fa genome.zip /tmp/fasta_inspection.json
            rm -rf ncbi_dataset README.md md5sum.txt
            for attempt in 1 2 3; do
              rm -f genome.zip
              if datasets download genome accession "${ACCESSION}" \
                  --include genome --filename genome.zip --no-progressbar; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "ERROR: NCBI FASTA fallback download failed after ${attempt} attempts"
                exit 1
              fi
              sleep $((attempt * 30))
            done
            unzip -o genome.zip
            FASTA=$(find ncbi_dataset/data -name "*.fna" -print -quit)
            if [ -z "$FASTA" ]; then
              echo "ERROR: No FASTA file found in NCBI Datasets fallback"
              exit 1
            fi
            mv "$FASTA" genome.fa
            rm -f genome.zip
            rm -rf ncbi_dataset README.md md5sum.txt

            python3 scripts/inspect_fasta.py genome.fa \
              --source ncbi \
              --json /tmp/fasta_inspection.json
            FALLBACK_FASTA_SIZE=$(stat -c%s genome.fa 2>/dev/null || stat -f%z genome.fa 2>/dev/null || echo 0)
            if [ "$FALLBACK_FASTA_SIZE" -gt "$THRESHOLD" ]; then
              USED_LONG=true
            fi
            if [ "$USED_LONG" = "true" ]; then
              faToTwoBit -long genome.fa genome.2bit
            else
              faToTwoBit genome.fa genome.2bit
            fi
            rm -f genome.fa
          fi

          test -s genome.2bit
          ls -lh genome.2bit
          END=$(date +%s)
          FASTA_SIZE=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json'))['fasta_size_bytes'])")
          SEQ_COUNT=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json'))['seq_count'])")
          SEQ_IDS=$(python3 -c "import json; print(','.join(json.load(open('/tmp/fasta_inspection.json'))['seq_ids']))")
          SAMPLED_BASES=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json'))['sampled_bases'])")
          COMPRESSED_SIZE=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('compressed_size_bytes', 0))")
          COMPRESSED_MD5=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('compressed_md5', ''))")
          PIPELINE_WALL=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('timings_sec', {}).get('pipeline_wall', ''))")
          PYTHON_CPU=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('timings_sec', {}).get('python_cpu', ''))")
          CONVERTER_CPU=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('timings_sec', {}).get('converter_cpu', ''))")
          TWOBIT_SIZE=$(stat -c%s genome.2bit 2>/dev/null || stat -f%z genome.2bit 2>/dev/null || echo 0)
          STREAM_SECONDS=$((END - START))
          python3 scripts/record_metric.py timings_sec.ncbi_acquisition_to_2bit $((STREAM_SECONDS + ${RESOLVE_SECONDS:-0}))
          python3 scripts/record_metric.py timings_sec.ncbi_stream_to_2bit "$STREAM_SECONDS"
          python3 scripts/record_metric.py ncbi_acquisition_mode "$ACQUISITION_MODE"
          python3 scripts/record_metric.py ncbi_stream.attempt_count "$ATTEMPT_COUNT"
          python3 scripts/record_metric.py fasta_size_bytes "$FASTA_SIZE"
          python3 scripts/record_metric.py seq_count "$SEQ_COUNT"
          python3 scripts/record_metric.py fasta_inspection.sampled_bases "$SAMPLED_BASES"
          python3 scripts/record_metric.py fasta_inspection.exhaustive_validation false
          python3 scripts/record_metric.py twobit_size_bytes "$TWOBIT_SIZE"
          python3 scripts/record_metric.py used_long_2bit "$USED_LONG"
          [ "$COMPRESSED_SIZE" -gt 0 ] && python3 scripts/record_metric.py ncbi_stream.compressed_size_bytes "$COMPRESSED_SIZE" || true
          [ -n "$COMPRESSED_MD5" ] && python3 scripts/record_metric.py ncbi_stream.compressed_md5 "$COMPRESSED_MD5" || true
          [ -n "$PIPELINE_WALL" ] && python3 scripts/record_metric.py ncbi_stream.pipeline_wall_seconds "$PIPELINE_WALL" || true
          [ -n "$PYTHON_CPU" ] && python3 scripts/record_metric.py timings_cpu_sec.ncbi_stream_python "$PYTHON_CPU" || true
          [ -n "$CONVERTER_CPU" ] && python3 scripts/record_metric.py timings_cpu_sec.ncbi_stream_converter "$CONVERTER_CPU" || true
          python3 scripts/record_metric.py disk_used_checkpoint_gb.after_2bit $(awk "BEGIN{printf \"%.2f\", ($(df -Pk . | awk 'NR==2 {print $3}')) / 1024 / 1024}")
          echo "seq_ids=${SEQ_IDS}" >> "$GITHUB_OUTPUT"
          echo "seq_count=${SEQ_COUNT}" >> "$GITHUB_OUTPUT"
          echo "fasta_size=${FASTA_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Stream Ensembl, URL, or uploaded FASTA to 2bit
        id: file_fasta_info
        if: steps.params.outputs.fasta_source != 'ncbi'
        env:
          FASTA_SOURCE: ${{ steps.params.outputs.fasta_source }}
          FASTA_URL: ${{ steps.params.outputs.fasta_url }}
          FASTA_UPLOAD_URL: ${{ steps.params.outputs.fasta_upload_url }}
          FASTA_FILE_NAME: ${{ steps.params.outputs.fasta_file_name }}
          FASTA_FILE_SIZE: ${{ steps.params.outputs.fasta_file_size }}
          SPECIES_URL: ${{ steps.params.outputs.species_url }}
          ENSEMBL_GROUP: ${{ steps.params.outputs.ensembl_group }}
          ACCESSION: ${{ steps.params.outputs.accession }}
          EXPECTED_ASSEMBLY: ${{ steps.params.outputs.genome }}
        run: |
          set -o pipefail
          python3 scripts/record_metric.py current_stage fasta_stream_to_2bit
          source scripts/resource_sampler.sh
          start_resource_sampler fasta_stream_to_2bit
          trap stop_resource_sampler EXIT

          case "$FASTA_SOURCE" in
            ensembl)
              if [ -z "$SPECIES_URL" ] || [ -z "$ENSEMBL_GROUP" ]; then
                echo "ERROR: missing Ensembl species_url or group"
                exit 1
              fi
              echo "Resolving Ensembl FASTA: species_url=$SPECIES_URL group=$ENSEMBL_GROUP accession=$ACCESSION"
              SOURCE_URL=$(python3 scripts/resolve_ensembl_fasta.py "$SPECIES_URL" "$ENSEMBL_GROUP" "$ACCESSION" "$EXPECTED_ASSEMBLY")
              ;;
            url)
              SOURCE_URL="$FASTA_URL"
              ;;
            upload)
              SOURCE_URL="$FASTA_UPLOAD_URL"
              ;;
            *)
              echo "ERROR: unsupported streaming FASTA source: $FASTA_SOURCE"
              exit 1
              ;;
          esac
          if [ -z "$SOURCE_URL" ]; then
            echo "ERROR: missing or unresolved FASTA URL for source $FASTA_SOURCE"
            exit 1
          fi

          START=$(date +%s)
          THRESHOLD=$((12 * 1024 * 1024 * 1024))
          LONG_ARG=()
          USED_LONG=false
          if [[ "$FASTA_FILE_SIZE" =~ ^[0-9]+$ ]] && [ "$FASTA_FILE_SIZE" -gt "$THRESHOLD" ]; then
            echo "Large uploaded input (${FASTA_FILE_SIZE} bytes); using -long 2bit format"
            LONG_ARG=(--long)
            USED_LONG=true
          fi

          STREAMED=false
          ATTEMPT_COUNT=0
          rm -f genome.2bit /tmp/fasta_inspection.json
          for attempt in 1 2 3; do
            ATTEMPT_COUNT=$attempt
            rm -f genome.2bit /tmp/fasta_inspection.json
            echo "${FASTA_SOURCE} streaming attempt ${attempt}/3"
            set +e
            curl -fL --silent --show-error \
                --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
                "$SOURCE_URL" \
              | python3 scripts/stream_fasta_to_2bit.py \
                  --source "$FASTA_SOURCE" \
                  --compression auto \
                  --output genome.2bit \
                  --json /tmp/fasta_inspection.json \
                  "${LONG_ARG[@]}"
            PIPE_STATUS=("${PIPESTATUS[@]}")
            set -e
            CURL_STATUS=${PIPE_STATUS[0]}
            CONVERTER_STATUS=${PIPE_STATUS[1]}
            if [ "$CURL_STATUS" = "0" ] && [ "$CONVERTER_STATUS" = "0" ]; then
              STREAMED=true
              break
            fi
            if [ "$CONVERTER_STATUS" = "75" ] && [ "$USED_LONG" != "true" ]; then
              echo "Standard 2bit index overflowed; retrying the source with -long"
              LONG_ARG=(--long)
              USED_LONG=true
              continue
            fi
            if [ "$CURL_STATUS" = "0" ]; then
              echo "ERROR: FASTA inspection or conversion failed with status $CONVERTER_STATUS"
              exit "$CONVERTER_STATUS"
            fi
            echo "WARNING: FASTA streaming attempt ${attempt} failed during transfer"
            if [ "$attempt" != "3" ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$STREAMED" != "true" ]; then
            echo "ERROR: FASTA streaming failed after ${ATTEMPT_COUNT} attempts"
            exit 1
          fi

          ls -lh genome.2bit
          END=$(date +%s)
          FASTA_SIZE=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json'))['fasta_size_bytes'])")
          SEQ_COUNT=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json'))['seq_count'])")
          SEQ_IDS=$(python3 -c "import json; print(','.join(json.load(open('/tmp/fasta_inspection.json'))['seq_ids']))")
          SAMPLED_BASES=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json'))['sampled_bases'])")
          INPUT_SIZE=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('input_size_bytes', 0))")
          INPUT_MD5=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('input_md5', ''))")
          INPUT_COMPRESSION=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('input_compression', ''))")
          PIPELINE_WALL=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('timings_sec', {}).get('pipeline_wall', ''))")
          PYTHON_CPU=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('timings_sec', {}).get('python_cpu', ''))")
          CONVERTER_CPU=$(python3 -c "import json; print(json.load(open('/tmp/fasta_inspection.json')).get('timings_sec', {}).get('converter_cpu', ''))")
          TWOBIT_SIZE=$(stat -c%s genome.2bit 2>/dev/null || stat -f%z genome.2bit 2>/dev/null || echo 0)
          STREAM_SECONDS=$((END - START))
          python3 scripts/record_metric.py timings_sec.fasta_stream_to_2bit "$STREAM_SECONDS"
          python3 scripts/record_metric.py fasta_stream.pipeline_wall_seconds "$PIPELINE_WALL"
          python3 scripts/record_metric.py fasta_stream.attempt_count "$ATTEMPT_COUNT"
          python3 scripts/record_metric.py fasta_stream.input_size_bytes "$INPUT_SIZE"
          python3 scripts/record_metric.py fasta_stream.input_md5 "$INPUT_MD5"
          python3 scripts/record_metric.py fasta_stream.input_compression "$INPUT_COMPRESSION"
          [ -n "$PYTHON_CPU" ] && python3 scripts/record_metric.py timings_cpu_sec.fasta_stream_python "$PYTHON_CPU" || true
          [ -n "$CONVERTER_CPU" ] && python3 scripts/record_metric.py timings_cpu_sec.fasta_stream_converter "$CONVERTER_CPU" || true
          python3 scripts/record_metric.py fasta_acquisition_mode "${FASTA_SOURCE}-stream"
          python3 scripts/record_metric.py fasta_source "$FASTA_SOURCE"
          python3 scripts/record_metric.py fasta_size_bytes "$FASTA_SIZE"
          python3 scripts/record_metric.py seq_count "$SEQ_COUNT"
          python3 scripts/record_metric.py fasta_inspection.sampled_bases "$SAMPLED_BASES"
          python3 scripts/record_metric.py fasta_inspection.exhaustive_validation false
          python3 scripts/record_metric.py twobit_size_bytes "$TWOBIT_SIZE"
          python3 scripts/record_metric.py used_long_2bit "$USED_LONG"
          [ -n "$FASTA_FILE_SIZE" ] && python3 scripts/record_metric.py upload_file_size_bytes "$FASTA_FILE_SIZE" || true
          python3 scripts/record_metric.py disk_used_checkpoint_gb.after_2bit $(awk "BEGIN{printf \"%.2f\", ($(df -Pk . | awk 'NR==2 {print $3}')) / 1024 / 1024}")
          echo "seq_ids=${SEQ_IDS}" >> "$GITHUB_OUTPUT"
          echo "seq_count=${SEQ_COUNT}" >> "$GITHUB_OUTPUT"
          echo "fasta_size=${FASTA_SIZE}" >> "$GITHUB_OUTPUT"

          if [ "$FASTA_SOURCE" = "upload" ]; then
            curl -fsS -X DELETE "$FASTA_UPLOAD_URL" >/dev/null || true
          fi

      - name: Expose FASTA metadata
        id: fasta_info
        env:
          NCBI_SEQ_IDS: ${{ steps.ncbi_fasta_info.outputs.seq_ids }}
          NCBI_SEQ_COUNT: ${{ steps.ncbi_fasta_info.outputs.seq_count }}
          NCBI_FASTA_SIZE: ${{ steps.ncbi_fasta_info.outputs.fasta_size }}
          FILE_SEQ_IDS: ${{ steps.file_fasta_info.outputs.seq_ids }}
          FILE_SEQ_COUNT: ${{ steps.file_fasta_info.outputs.seq_count }}
          FILE_FASTA_SIZE: ${{ steps.file_fasta_info.outputs.fasta_size }}
        run: |
          SEQ_IDS="${NCBI_SEQ_IDS:-$FILE_SEQ_IDS}"
          SEQ_COUNT="${NCBI_SEQ_COUNT:-$FILE_SEQ_COUNT}"
          FASTA_SIZE="${NCBI_FASTA_SIZE:-$FILE_FASTA_SIZE}"
          if [ -z "$SEQ_IDS" ] || [ -z "$SEQ_COUNT" ] || [ -z "$FASTA_SIZE" ]; then
            echo "ERROR: FASTA metadata was not produced"
            exit 1
          fi
          echo "seq_ids=${SEQ_IDS}" >> "$GITHUB_OUTPUT"
          echo "seq_count=${SEQ_COUNT}" >> "$GITHUB_OUTPUT"
          echo "fasta_size=${FASTA_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Generate seed file
        env:
          BUILD_PARAM_PACKAGE_NAME: ${{ steps.params.outputs.package_name }}
          BUILD_PARAM_TITLE: ${{ steps.params.outputs.title }}
          BUILD_PARAM_DESCRIPTION: ${{ steps.params.outputs.description }}
          BUILD_PARAM_ORGANISM: ${{ steps.params.outputs.organism }}
          BUILD_PARAM_COMMON_NAME: ${{ steps.params.outputs.common_name }}
          BUILD_PARAM_GENOME: ${{ steps.params.outputs.genome }}
          BUILD_PARAM_PROVIDER: ${{ steps.params.outputs.provider }}
          BUILD_PARAM_RELEASE_DATE: ${{ steps.params.outputs.release_date }}
          BUILD_PARAM_VERSION: ${{ steps.params.outputs.version }}
          BUILD_PARAM_SOURCE_URL: ${{ steps.params.outputs.source_url }}
        run: |
          python3 scripts/record_metric.py current_stage seed_generation
          START=$(date +%s)
          python3 scripts/build_input.py
          END=$(date +%s)
          python3 scripts/record_metric.py timings_sec.seed_generation $((END - START))

      - name: Forge BSgenome data package (R)
        env:
          PACKAGE: ${{ steps.params.outputs.package_name }}
        run: |
          python3 scripts/record_metric.py current_stage forge
          source scripts/resource_sampler.sh
          start_resource_sampler forge
          trap stop_resource_sampler EXIT
          START=$(date +%s)
          Rscript --vanilla -e "
            suppressPackageStartupMessages(library(BSgenome))
            tryCatch({
              BSgenomeForge::forgeBSgenomeDataPkg('${PACKAGE}.seed')
            }, error = function(e) {
              message('forgeBSgenomeDataPkg error: ', e\$message)
              message('Attempting manual package creation (mv instead of copy)...')
              dir.create('./${PACKAGE}/inst/extdata/', recursive = TRUE, showWarnings = FALSE)
              ok <- file.rename('./genome.2bit', './${PACKAGE}/inst/extdata/single_sequences.2bit')
              if (!ok) {
                file.copy('./genome.2bit', './${PACKAGE}/inst/extdata/single_sequences.2bit')
              }
            })
            # Report peak RSS for this R process — VmHWM is the high-water mark.
            status <- readLines('/proc/self/status')
            hwm <- grep('^VmHWM:', status, value = TRUE)
            if (length(hwm)) cat(sprintf('METRIC_FORGE_HWM_KB=%s\n', sub('[^0-9]*([0-9]+).*', '\\\\1', hwm)))
          " 2>&1 | tee /tmp/forge.log
          python3 scripts/build_input.py --rewrite-forged-metadata "${PACKAGE}.seed"

          if [ -f genome.2bit ] && [ -f "./${PACKAGE}/inst/extdata/single_sequences.2bit" ]; then
            echo "Removing source genome.2bit (already copied into package)"
            rm -f genome.2bit
          fi
          df -h . | tail -2

          END=$(date +%s)
          HWM_KB=$(grep '^METRIC_FORGE_HWM_KB=' /tmp/forge.log | tail -1 | sed 's/.*=//')
          python3 scripts/record_metric.py timings_sec.forge $((END - START))
          [ -n "$HWM_KB" ] && python3 scripts/record_metric.py peak_mem_mb.forge $((HWM_KB / 1024)) || true
          python3 scripts/record_metric.py disk_used_checkpoint_gb.after_forge $(awk "BEGIN{printf \"%.2f\", ($(df -Pk . | awk 'NR==2 {print $3}')) / 1024 / 1024}")

      - name: R CMD build (assemble tarball)
        env:
          PACKAGE: ${{ steps.params.outputs.package_name }}
          # R's built-in utils::tar() rejects files > 8 GB. Force use of the
          # external GNU tar binary, which has no such limit. Discovered via
          # Neoceratodus forsteri 34.56 GB (2bit ~8.6 GB, tarball ~8 GB).
          R_BUILD_TAR: tar
        run: |
          python3 scripts/record_metric.py current_stage rcmd_build
          source scripts/resource_sampler.sh
          start_resource_sampler rcmd_build
          trap stop_resource_sampler EXIT
          START=$(date +%s)
          # Wrap with GNU time if available, so we capture Max RSS across the
          # whole R-CMD-build subprocess tree (plain R cannot self-report its
          # subprocesses). Fall back to plain invocation if time(1) is missing.
          if command -v /usr/bin/time >/dev/null 2>&1; then
            /usr/bin/time -v -o /tmp/rbuild_time.log \
              R CMD build --no-manual --no-build-vignettes "${PACKAGE}"
          else
            R CMD build --no-manual --no-build-vignettes "${PACKAGE}"
          fi
          ls -lh ${PACKAGE}_*.tar.gz
          rm -rf "${PACKAGE}"
          df -h . | tail -2

          END=$(date +%s)
          BUILD_SECONDS=$((END - START))
          python3 scripts/record_metric.py timings_sec.rcmd_build "$BUILD_SECONDS"
          python3 scripts/record_metric.py timings_sec.package_compression "$BUILD_SECONDS"
          if [ -f /tmp/rbuild_time.log ]; then
            MAX_KB=$(grep "Maximum resident set size" /tmp/rbuild_time.log | awk '{print $NF}')
            [ -n "$MAX_KB" ] && python3 scripts/record_metric.py peak_mem_mb.rcmd_build $((MAX_KB / 1024)) || true
          fi
          TARBALL=$(find . -maxdepth 1 -type f -name "${PACKAGE}_*.tar.gz" -print -quit)
          TB_SIZE=$(stat -c%s "$TARBALL" 2>/dev/null || stat -f%z "$TARBALL" 2>/dev/null || echo 0)
          ARCHIVE_COMPLETED=$(date +%s)
          python3 scripts/record_metric.py timings_epoch.archive_completed "$ARCHIVE_COMPLETED"
          python3 scripts/record_metric.py tarball_size_bytes $TB_SIZE
          python3 scripts/record_metric.py disk_used_checkpoint_gb.after_rcmd_build $(awk "BEGIN{printf \"%.2f\", ($(df -Pk . | awk 'NR==2 {print $3}')) / 1024 / 1024}")

      - name: Validate package archive
        id: archive_validation
        env:
          PACKAGE: ${{ steps.params.outputs.package_name }}
        run: |
          python3 scripts/record_metric.py current_stage archive_validation
          source scripts/resource_sampler.sh
          start_resource_sampler archive_validation
          trap stop_resource_sampler EXIT
          START=$(date +%s)
          TARBALL=$(find . -maxdepth 1 -type f -name "${PACKAGE}_*.tar.gz" -print -quit)
          PACKAGE_SHA256=$(bash scripts/validate_package_archive.sh "$TARBALL" "$PACKAGE")
          END=$(date +%s)
          python3 scripts/record_metric.py timings_sec.archive_validation $((END - START))
          python3 scripts/record_metric.py package_sha256 "$PACKAGE_SHA256"
          python3 scripts/record_metric.py archive_valid true
          echo "package_sha256=${PACKAGE_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Determine storage backend
        id: storage
        env:
          PACKAGE: ${{ steps.params.outputs.package_name }}
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          python3 scripts/record_metric.py current_stage storage_selection
          START=$(date +%s)
          TARBALL="${PACKAGE}_${VERSION}.tar.gz"
          SIZE=$(stat -c%s "${TARBALL}" 2>/dev/null || stat -f%z "${TARBALL}" 2>/dev/null || echo "0")
          # GitHub Releases hard-cap is 2 GiB per asset. Use Zenodo above 1.9 GiB
          # for safety margin (headers, multipart boundaries).
          LIMIT=$((1900 * 1024 * 1024))
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "backend=zenodo" >> $GITHUB_OUTPUT
            echo "Oversized tarball ($SIZE bytes); using Zenodo backend"
          else
            echo "backend=github" >> $GITHUB_OUTPUT
            echo "Standard tarball ($SIZE bytes); using GitHub Releases"
          fi
          echo "tarball_size=$SIZE" >> $GITHUB_OUTPUT
          END=$(date +%s)
          python3 scripts/record_metric.py timings_sec.storage_selection $((END - START))

      - name: Reject oversized temporary package
        if: steps.storage.outputs.backend == 'zenodo' && steps.params.outputs.publish_to_index != 'true' && steps.params.outputs.benchmark_mode != 'true'
        run: |
          echo "ERROR: temporary build produced a tarball larger than the GitHub Releases asset limit. Zenodo is reserved for curator-approved index builds."
          exit 1

      - name: Create GitHub Release
        if: steps.storage.outputs.backend == 'github' && steps.params.outputs.publish_to_index != 'true' && steps.params.outputs.benchmark_mode != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
          PACKAGE: ${{ steps.params.outputs.package_name }}
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="build-${JOB_ID}"
          TARBALL="${PACKAGE}_${VERSION}.tar.gz"

          gh release delete "${TAG}" --yes 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

          gh release create "${TAG}" \
            "${TARBALL}" \
            --title "${PACKAGE} ${VERSION}" \
            --notes "Built by [AutoBSgenome Web](https://autobsgenome.org).

          **Install in R:**
          \`\`\`r
          install.packages(\"https://github.com/${{ github.repository }}/releases/download/${TAG}/${TARBALL}\", repos = NULL, type = \"source\")
          \`\`\`

          > This release will be automatically cleaned up after 2 days."

      - name: Publish to permanent repository
        if: steps.storage.outputs.backend == 'github' && steps.params.outputs.publish_to_index == 'true' && (steps.params.outputs.fasta_source == 'ncbi' || steps.params.outputs.fasta_source == 'ensembl')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.params.outputs.package_name }}
          VERSION: ${{ steps.params.outputs.version }}
          ORGANISM: ${{ steps.params.outputs.organism }}
          ASSEMBLY: ${{ steps.params.outputs.genome }}
          PROVIDER: ${{ steps.params.outputs.provider }}
          ACCESSION: ${{ steps.params.outputs.accession }}
          RELEASE_DATE: ${{ steps.params.outputs.release_date }}
          SOURCE_URL: ${{ steps.params.outputs.source_url }}
          DATA_SOURCE: ${{ steps.params.outputs.data_source }}
          PACKAGE_SHA256: ${{ steps.archive_validation.outputs.package_sha256 }}
          SEQ_IDS: ${{ steps.fasta_info.outputs.seq_ids }}
          SEQ_COUNT: ${{ steps.fasta_info.outputs.seq_count }}
        run: |
          python3 scripts/record_metric.py current_stage publication_github
          source scripts/resource_sampler.sh
          start_resource_sampler publication_github
          trap stop_resource_sampler EXIT
          PUBLISH_START=$(date +%s)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TARBALL="${PACKAGE}_${VERSION}.tar.gz"
          PERM_TAG="pkg-${PACKAGE}"
          if [ -z "$SOURCE_URL" ]; then
            if [ "$DATA_SOURCE" = "ensembl" ]; then
              SOURCE_URL="https://www.ensembl.org/"
            else
              SOURCE_URL="https://www.ncbi.nlm.nih.gov/datasets/genome/${ACCESSION}/"
            fi
          fi
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WORKFLOW_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILDER_IMAGE="ghcr.io/johnnychen1113/autobsgenome-builder@sha256:6e347d533e7db4bd0a65c38d884184884590664ad3b5e47a14401079f3625e95"
          DESCRIPTION_SHA256=$(PACKAGE="$PACKAGE" TARBALL="$TARBALL" python3 <<'PYEOF'
          import hashlib
          import os
          import tarfile

          package = os.environ["PACKAGE"]
          tarball = os.environ["TARBALL"]
          try:
              with tarfile.open(tarball, "r:gz") as tf:
                  member = tf.extractfile(f"{package}/DESCRIPTION")
                  if member:
                      print(hashlib.sha256(member.read()).hexdigest())
          except Exception:
              pass
          PYEOF
          )
          LOCAL_SIZE=$(stat -c%s "${TARBALL}" 2>/dev/null || stat -f%z "${TARBALL}" 2>/dev/null || echo "0")

          # Reuse published bytes only after verifying filename, size, and hash.
          # Preserve a differing published artifact for an explicit curator decision.
          EXISTING=$(gh release view "${PERM_TAG}" --json isDraft,assets,body 2>/dev/null || echo '{}')
          IS_DRAFT=$(echo "$EXISTING" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('isDraft', 'missing'))")
          EXISTING_ACCESSION=$(echo "$EXISTING" | python3 -c "import json,re,sys; d=json.load(sys.stdin); m=re.search(r'GC[AF]_[0-9]+\.[0-9]+', d.get('body','')); print(m.group(0) if m else '')")

          if [ "$IS_DRAFT" = "False" ] && [ -z "$EXISTING_ACCESSION" ]; then
            echo "ERROR: ${PERM_TAG} already exists but its source accession cannot be verified; refusing to overwrite it."
            exit 1
          fi
          if [ "$IS_DRAFT" = "False" ] && [ "$EXISTING_ACCESSION" != "$ACCESSION" ]; then
            echo "ERROR: package-name collision: ${PERM_TAG} belongs to ${EXISTING_ACCESSION}, not ${ACCESSION}."
            echo "Use the collision-safe package name supplied by catalog.json."
            exit 1
          fi

          if [ "$IS_DRAFT" = "True" ]; then
            echo "Existing release is a draft (orphan from interrupted upload); deleting and re-uploading"
            gh release delete "${PERM_TAG}" --yes --cleanup-tag 2>/dev/null || true
          elif [ "$IS_DRAFT" = "False" ]; then
            EXISTING_RELEASE="$EXISTING" python3 scripts/verify_release_asset.py \
              "$PERM_TAG" "$TARBALL" "$LOCAL_SIZE" "$PACKAGE_SHA256"
            echo "Published tarball matches filename, size, and SHA-256; skipping re-upload"
            SKIP_UPLOAD=1
          fi

          if [ "${SKIP_UPLOAD:-0}" != "1" ]; then
          gh release create "${PERM_TAG}" \
            "${TARBALL}" \
            --title "${PACKAGE} ${VERSION}" \
            --notes "| | |
          |---|---|
          | **Organism** | ${ORGANISM} |
          | **Assembly** | ${ASSEMBLY} |
          | **Provider** | ${PROVIDER} |
          | **Accession** | [\`${ACCESSION}\`](${SOURCE_URL}) |
          | **Version** | ${VERSION} |
          | **Package** | \`${PACKAGE}\` |

          **Install in R:**
          \`\`\`r
          install.packages(\"${PACKAGE}\", repos = \"https://johnnychen1113.github.io/autoBSgenome\")
          \`\`\`

          > [Browse all packages](https://johnnychen1113.github.io/autoBSgenome) | [Build your own](https://autobsgenome.org)

          Published via [AutoBSgenome](https://autobsgenome.org)."
          fi  # end: if SKIP_UPLOAD != 1

          PUBLISH_END=$(date +%s)
          python3 scripts/record_metric.py timings_sec.package_publication $((PUBLISH_END - PUBLISH_START))

          # Trigger index update on gh-pages. Pack seq_ids + metrics into
          # storage_info to stay under the 10-property client_payload cap.
          FILESIZE=$(stat -c%s "${TARBALL}" 2>/dev/null || stat -f%z "${TARBALL}" 2>/dev/null || echo "0")
          # Record seq_count in metrics too so it lives alongside the rest.
          python3 scripts/record_metric.py seq_count "${SEQ_COUNT:-0}"
          STORAGE_INFO=$(SEQ_IDS="$SEQ_IDS" SOURCE_URL="$SOURCE_URL" RELEASE_DATE="$RELEASE_DATE" PROVIDER="$PROVIDER" ACCESSION="$ACCESSION" BUILT_AT="$BUILT_AT" WORKFLOW_RUN_ID="${{ github.run_id }}" WORKFLOW_RUN_URL="$WORKFLOW_RUN_URL" BUILDER_IMAGE="$BUILDER_IMAGE" PACKAGE_SHA256="$PACKAGE_SHA256" DESCRIPTION_SHA256="$DESCRIPTION_SHA256" python3 -c "
          import json, os
          try:
              metrics = json.load(open('/tmp/build_metrics.json'))
          except Exception:
              metrics = {}
          print(json.dumps({
              'storage': 'github-release',
              'source_url': os.environ.get('SOURCE_URL',''),
              'release_date': os.environ.get('RELEASE_DATE',''),
              'seq_ids': os.environ.get('SEQ_IDS',''),
              'metrics': metrics,
              'provenance': {
                  'schema_version': 1,
                  'provider': os.environ.get('PROVIDER',''),
                  'source_url': os.environ.get('SOURCE_URL',''),
                  'source_accession': os.environ.get('ACCESSION',''),
                  'built_at': os.environ.get('BUILT_AT',''),
                  'workflow_run_id': os.environ.get('WORKFLOW_RUN_ID',''),
                  'workflow_run_url': os.environ.get('WORKFLOW_RUN_URL',''),
                  'builder_image': os.environ.get('BUILDER_IMAGE',''),
                  'package_sha256': os.environ.get('PACKAGE_SHA256',''),
                  'description_sha256': os.environ.get('DESCRIPTION_SHA256',''),
              },
          }))")
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            -f event_type=update_repo_index \
            -f "client_payload[package_name]=${PACKAGE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[organism]=${ORGANISM}" \
            -f "client_payload[assembly]=${ASSEMBLY}" \
            -f "client_payload[provider]=${PROVIDER}" \
            -f "client_payload[accession]=${ACCESSION}" \
            -f "client_payload[file_name]=${TARBALL}" \
            -f "client_payload[file_size]=${FILESIZE}" \
            -f "client_payload[seq_count]=${SEQ_COUNT}" \
            -f "client_payload[storage_info]=${STORAGE_INFO}"

      - name: Publish oversized tarball to Zenodo
        if: steps.storage.outputs.backend == 'zenodo' && steps.params.outputs.publish_to_index == 'true' && (steps.params.outputs.fasta_source == 'ncbi' || steps.params.outputs.fasta_source == 'ensembl')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          PACKAGE: ${{ steps.params.outputs.package_name }}
          VERSION: ${{ steps.params.outputs.version }}
          ORGANISM: ${{ steps.params.outputs.organism }}
          ASSEMBLY: ${{ steps.params.outputs.genome }}
          PROVIDER: ${{ steps.params.outputs.provider }}
          ACCESSION: ${{ steps.params.outputs.accession }}
          RELEASE_DATE: ${{ steps.params.outputs.release_date }}
          SOURCE_URL: ${{ steps.params.outputs.source_url }}
          DATA_SOURCE: ${{ steps.params.outputs.data_source }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
          PACKAGE_SHA256: ${{ steps.archive_validation.outputs.package_sha256 }}
          SEQ_IDS: ${{ steps.fasta_info.outputs.seq_ids }}
          SEQ_COUNT: ${{ steps.fasta_info.outputs.seq_count }}
          FILESIZE: ${{ steps.storage.outputs.tarball_size }}
        run: |
          python3 scripts/record_metric.py current_stage publication_zenodo
          source scripts/resource_sampler.sh
          start_resource_sampler publication_zenodo
          trap stop_resource_sampler EXIT
          PUBLISH_START=$(date +%s)
          TARBALL="${PACKAGE}_${VERSION}.tar.gz"

          # Source URL points at NCBI or Ensembl depending on the data source
          if [ -z "$SOURCE_URL" ]; then
            if [ "$DATA_SOURCE" = "ensembl" ]; then
              SOURCE_URL="https://www.ensembl.org/"
            else
              SOURCE_URL="https://www.ncbi.nlm.nih.gov/datasets/genome/${ACCESSION}/"
            fi
          fi
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WORKFLOW_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILDER_IMAGE="ghcr.io/johnnychen1113/autobsgenome-builder@sha256:6e347d533e7db4bd0a65c38d884184884590664ad3b5e47a14401079f3625e95"
          DESCRIPTION_SHA256=$(PACKAGE="$PACKAGE" TARBALL="$TARBALL" python3 <<'PYEOF'
          import hashlib
          import os
          import tarfile

          package = os.environ["PACKAGE"]
          tarball = os.environ["TARBALL"]
          try:
              with tarfile.open(tarball, "r:gz") as tf:
                  member = tf.extractfile(f"{package}/DESCRIPTION")
                  if member:
                      print(hashlib.sha256(member.read()).hexdigest())
          except Exception:
              pass
          PYEOF
          )

          # Rich HTML description so Zenodo's record page clearly shows provenance
          DESC="<p>BSgenome data package for <i>${ORGANISM}</i> (assembly <code>${ASSEMBLY}</code>), generated by <a href='https://autobsgenome.org'>autoBSgenome</a> from the ${PROVIDER} reference assembly.</p><table><tr><th>Organism</th><td>${ORGANISM}</td></tr><tr><th>Assembly</th><td>${ASSEMBLY}</td></tr><tr><th>Data source</th><td><b>${PROVIDER}</b></td></tr><tr><th>Accession</th><td><a href='${SOURCE_URL}'>${ACCESSION}</a></td></tr><tr><th>Package</th><td><code>${PACKAGE}</code></td></tr></table><p><b>Install in R:</b></p><pre>install.packages(\"DOWNLOAD_URL_HERE\", repos = NULL, type = \"source\")</pre><p>Part of the <a href='https://zenodo.org/communities/autobsgenome'>autoBSgenome</a> community. autoBSgenome builds Bioconductor-compatible BSgenome packages from any genome assembly — from public databases (NCBI, Ensembl) or from user-provided FASTA. Records in this community archive the tarballs that exceed GitHub Releases' 2 GiB asset limit; smaller packages are hosted on GitHub Releases under the same project.</p>"

          ZENODO_STATUS=/tmp/zenodo-status.json
          rm -f "$ZENODO_STATUS" /tmp/zenodo.json
          set +e
          python3 scripts/zenodo_upload.py upload "${TARBALL}" \
            --title "${PACKAGE} ${VERSION} (${PROVIDER} — ${ORGANISM})" \
            --description "${DESC}" \
            --creator "Chen, Junhao" \
            --creator "Lin, Zhenguo" \
            --license "artistic-2.0" \
            --community "autobsgenome" \
            --keywords "BSgenome,Bioconductor,${ORGANISM},${PROVIDER},${ASSEMBLY},autoBSgenome,R package,reference genome,eukaryote" \
            --related "${SOURCE_URL},https://github.com/${{ github.repository }},https://autobsgenome.org" \
            --job-id "$JOB_ID" \
            --status-file "$ZENODO_STATUS" \
            > /tmp/zenodo.json
          ZENODO_RC=$?
          set -e

          if [ "$ZENODO_RC" -ne 0 ]; then
            ZENODO_FAILURE_STAGE=$(python3 -c "import json,sys; status=json.load(open(sys.argv[1])); print(status.get('failure_stage') or status.get('stage') or 'publication_zenodo')" "$ZENODO_STATUS" 2>/dev/null || echo publication_zenodo)
            ZENODO_DEPOSIT_ID=$(python3 -c "import json,sys; value=json.load(open(sys.argv[1])).get('deposit_id'); print('' if value is None else value)" "$ZENODO_STATUS" 2>/dev/null || true)
            python3 scripts/record_metric.py current_stage "$ZENODO_FAILURE_STAGE"
            python3 scripts/record_metric.py zenodo.failure_stage "$ZENODO_FAILURE_STAGE"
            if [ -n "$ZENODO_DEPOSIT_ID" ]; then
              python3 scripts/record_metric.py zenodo.deposit_id "$ZENODO_DEPOSIT_ID"
            fi
            exit "$ZENODO_RC"
          fi

          cat /tmp/zenodo.json
          DOI=$(python3 -c "import json;print(json.load(open('/tmp/zenodo.json'))['doi'] or '')")
          URL=$(python3 -c "import json;print(json.load(open('/tmp/zenodo.json'))['download_url'])")

          echo "Zenodo DOI: $DOI"
          echo "Zenodo URL: $URL"
          PUBLISH_END=$(date +%s)
          python3 scripts/record_metric.py timings_sec.package_publication $((PUBLISH_END - PUBLISH_START))

          # Pack storage + seq_ids + metrics into one JSON field so we stay
          # under the 10-property client_payload cap.
          python3 scripts/record_metric.py seq_count "${SEQ_COUNT:-0}"
          STORAGE_INFO=$(DOI="$DOI" URL="$URL" SEQ_IDS="$SEQ_IDS" SOURCE_URL="$SOURCE_URL" RELEASE_DATE="$RELEASE_DATE" PROVIDER="$PROVIDER" ACCESSION="$ACCESSION" BUILT_AT="$BUILT_AT" WORKFLOW_RUN_ID="${{ github.run_id }}" WORKFLOW_RUN_URL="$WORKFLOW_RUN_URL" BUILDER_IMAGE="$BUILDER_IMAGE" PACKAGE_SHA256="$PACKAGE_SHA256" DESCRIPTION_SHA256="$DESCRIPTION_SHA256" python3 -c "
          import json, os
          try:
              metrics = json.load(open('/tmp/build_metrics.json'))
          except Exception:
              metrics = {}
          print(json.dumps({
              'storage': 'zenodo',
              'doi': os.environ.get('DOI',''),
              'download_url': os.environ.get('URL',''),
              'source_url': os.environ.get('SOURCE_URL',''),
              'release_date': os.environ.get('RELEASE_DATE',''),
              'seq_ids': os.environ.get('SEQ_IDS',''),
              'metrics': metrics,
              'provenance': {
                  'schema_version': 1,
                  'provider': os.environ.get('PROVIDER',''),
                  'source_url': os.environ.get('SOURCE_URL',''),
                  'source_accession': os.environ.get('ACCESSION',''),
                  'built_at': os.environ.get('BUILT_AT',''),
                  'workflow_run_id': os.environ.get('WORKFLOW_RUN_ID',''),
                  'workflow_run_url': os.environ.get('WORKFLOW_RUN_URL',''),
                  'builder_image': os.environ.get('BUILDER_IMAGE',''),
                  'package_sha256': os.environ.get('PACKAGE_SHA256',''),
                  'description_sha256': os.environ.get('DESCRIPTION_SHA256',''),
              },
          }))")

          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            -f event_type=update_repo_index \
            -f "client_payload[package_name]=${PACKAGE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[organism]=${ORGANISM}" \
            -f "client_payload[assembly]=${ASSEMBLY}" \
            -f "client_payload[provider]=${PROVIDER}" \
            -f "client_payload[accession]=${ACCESSION}" \
            -f "client_payload[file_name]=${TARBALL}" \
            -f "client_payload[file_size]=${FILESIZE}" \
            -f "client_payload[seq_count]=${SEQ_COUNT}" \
            -f "client_payload[storage_info]=${STORAGE_INFO}"

      - name: Finalize benchmark report
        if: always() && steps.params.outputs.benchmark_mode == 'true'
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          PUBLICATION_ACTION: ${{ steps.params.outputs.benchmark_publication_action }}
        run: |
          mkdir -p benchmark-report
          python3 scripts/finalize_build_report.py \
            --metrics-file /tmp/build_metrics.json \
            --output benchmark-report/build-report.json \
            --workflow-status "$WORKFLOW_STATUS" \
            --publication-action "$PUBLICATION_ACTION"
          cp /tmp/build_metrics.json benchmark-report/raw-metrics.json 2>/dev/null || true
          cp /tmp/fasta_inspection.json benchmark-report/fasta-inspection.json 2>/dev/null || true
          cp /tmp/forge.log benchmark-report/forge.log 2>/dev/null || true
          cp /tmp/rbuild_time.log benchmark-report/rbuild-time.log 2>/dev/null || true
          cat benchmark-report/build-report.json

      - name: Remove benchmark package artifact
        if: always() && steps.params.outputs.benchmark_mode == 'true'
        env:
          PACKAGE: ${{ steps.params.outputs.package_name }}
        run: |
          TARBALL=$(find . -maxdepth 1 -type f -name "${PACKAGE}_*.tar.gz" -print -quit)
          if [ -n "$TARBALL" ]; then
            rm -f -- "$TARBALL"
            echo "Removed ephemeral benchmark package: $TARBALL"
          else
            echo "No benchmark package tarball remained to remove."
          fi

      - name: Upload benchmark report
        if: always() && steps.params.outputs.benchmark_mode == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ steps.params.outputs.job_id }}
          path: benchmark-report/
          retention-days: 90
          if-no-files-found: error

      - name: Report failure
        if: failure() && steps.params.outcome == 'success' && steps.params.outputs.benchmark_mode != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="build-${JOB_ID}"
          gh release create "${TAG}" \
            --title "Build Failed - ${JOB_ID}" \
            --notes "BUILD_FAILED: The BSgenome package build encountered an error. Please check your input parameters and try again." \
            2>/dev/null || true
